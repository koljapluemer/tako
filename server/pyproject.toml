[project]
name = "tako-ifc-mcp"
version = "0.1.0"
description = "MCP server for editing IFC models shown in the tako viewer"
authors = [
    { name = "Kolja Sam", email = "github@koljapluemer.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell>=0.9.0.post1",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
]

[project.scripts]
tako-ifc-mcp = "tako_ifc_mcp:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
