services:
  viewer:
    build: .
    restart: unless-stopped

  tako-stt:
    build:
      context: .
      target: stt
    restart: unless-stopped
    user: ${TAKO_UID:-1000}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ELEVENLABS_API_KEY_FILE: /run/secrets/elevenlabs_api_key
    secrets:
      - elevenlabs_api_key

  caddy:
    image: caddy:2.10-alpine
    environment:
      TAKO_DOMAIN: ${TAKO_DOMAIN:?set TAKO_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      viewer:
        condition: service_healthy
    restart: unless-stopped

secrets:
  elevenlabs_api_key:
    file: ./elevenlabs_api_key

volumes:
  caddy_data:
  caddy_config:
