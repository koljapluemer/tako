services:
  viewer:
    build: .
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      TAKO_DOMAIN: ${TAKO_DOMAIN:?set TAKO_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      viewer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
