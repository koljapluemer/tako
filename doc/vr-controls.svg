<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 830" width="1120" height="830" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">tako VR controls on Meta Quest controllers</title>
  <desc id="desc">Pushing the right thumbstick forward aims a teleport, turning it while aiming chooses the landing direction, and releasing it teleports; left or right snap turns 30 degrees. Pushing the left thumbstick forward aims a straight ray that places a table with the mini model, its controls on the table's edge and the revision cards behind it when released. Either trigger presses the panel it points at; otherwise the right trigger does what the held tool does: nothing with the pointer, spray paint with the spray can. A panel on the left controller shows the agent's messages and a compass with the distance to the latest change, which teleports there when pressed; it steps back and forth between revisions, picks the tool and turns the change highlight on or off. Grip grabs the mini model. Holding X returns to the start. While holding the spray can, tapping A undoes the last paint stroke and holding it deletes all paint. Holding Y or B talks to the agent.</desc>
  <defs>
    <g id="controller">
      <!-- Trigger, behind the body; its colour comes from the use element -->
      <path d="M300 372 C322 384 338 410 332 446 C328 466 306 462 300 444 C296 420 286 400 276 396 Z"/>
      <!-- Body -->
      <path d="M118 236 C150 206 262 204 298 240 C328 272 330 348 300 384 C284 402 268 410 264 436 C258 500 254 590 244 650 C240 682 170 688 158 652 C140 590 128 490 108 400 C88 350 86 270 118 236 Z" fill="#e7e5e0" stroke="#57534e" stroke-width="2"/>
      <ellipse cx="205" cy="310" rx="98" ry="76" fill="#d6d3cd"/>
      <!-- Grip -->
      <path d="M263 470 C274 500 270 590 256 625 L240 620 C250 580 252 510 248 475 Z" fill="#2563eb"/>
      <!-- Thumbstick base -->
      <circle cx="160" cy="290" r="38" fill="#a8a29e"/>
      <circle cx="160" cy="290" r="27" fill="#c4c0ba"/>
      <!-- Face buttons, unbound -->
      <circle cx="245" cy="282" r="21" fill="#b8b4ae"/>
      <circle cx="232" cy="342" r="21" fill="#b8b4ae"/>
      <!-- Menu / Meta, unbound -->
      <circle cx="172" cy="360" r="9" fill="#a8a29e"/>
    </g>
  </defs>

  <rect width="1120" height="830" fill="#fafaf7"/>

  <text x="560" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">tako VR controls</text>
  <text x="560" y="70" text-anchor="middle" font-size="14" fill="#57534e">Meta Quest controllers. Right hand moves you and holds the tool; left hand carries the panel and places the model.</text>

  <!-- Leaders -->
  <g fill="none" stroke-width="1.75" stroke-linejoin="round">
    <polyline stroke="#0f766e" points="960,252 960,150 740,150"/>
    <polyline stroke="#7c3aed" points="160,252 160,190 350,190 350,286 380,286"/>
    <polyline stroke="#dc2626" points="794,425 770,425 770,376 740,376"/>
    <polyline stroke="#dc2626" points="326,425 350,425 350,376 380,376"/>
    <polyline stroke="#2563eb" points="262,545 320,545 320,464 380,464"/>
    <polyline stroke="#2563eb" points="858,545 800,545 800,464 740,464"/>
  </g>

  <use href="#controller" xlink:href="#controller" fill="#dc2626"/>
  <use href="#controller" xlink:href="#controller" fill="#dc2626" transform="matrix(-1 0 0 1 1120 0)"/>

  <!-- Thumbsticks -->
  <circle cx="960" cy="290" r="27" fill="#0f766e"/>
  <circle cx="960" cy="290" r="18" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.5"/>
  <circle cx="160" cy="290" r="27" fill="#7c3aed"/>
  <circle cx="160" cy="290" r="18" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.5"/>

  <!-- X returns to the start -->
  <circle cx="232" cy="342" r="21" fill="#b45309"/>
  <polyline fill="none" stroke="#b45309" stroke-width="1.75" stroke-linejoin="round" points="232,363 232,570 380,570"/>

  <!-- A undoes paint -->
  <circle cx="888" cy="342" r="21" fill="#be185d"/>
  <polyline fill="none" stroke="#be185d" stroke-width="1.75" stroke-linejoin="round" points="888,363 888,630 740,630"/>

  <!-- Y and B talk -->
  <circle cx="245" cy="282" r="21" fill="#4d7c0f"/>
  <circle cx="875" cy="282" r="21" fill="#4d7c0f"/>

  <!-- Button letters are outside the mirrored group so they read correctly -->
  <g font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="245" y="288">Y</text>
    <text x="232" y="348">X</text>
    <text x="875" y="288">B</text>
    <text x="888" y="348">A</text>
  </g>
  <g font-size="13" fill="#57534e" text-anchor="middle">
    <text x="200" y="712">Left</text>
    <text x="920" y="712">Right</text>
  </g>

  <!-- Right thumbstick -->
  <rect x="380" y="96" width="360" height="130" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.75"/>
  <text x="396" y="122" font-size="16" font-weight="700" fill="#0f766e">Right thumbstick</text>
  <text x="536" y="122" font-size="16" font-weight="700" fill="#1c1917">Teleport</text>
  <g font-size="14" fill="#44403c">
    <text x="396" y="147"><tspan font-weight="600">Push forward:</tspan> aim with a curved beam</text>
    <text x="396" y="168"><tspan font-weight="600">Turn while aiming:</tspan> choose landing direction</text>
    <text x="396" y="189"><tspan font-weight="600">Release:</tspan> teleport there</text>
    <text x="396" y="210"><tspan font-weight="600">Left / right:</tspan> snap turn 30°</text>
  </g>

  <!-- Left thumbstick -->
  <rect x="380" y="242" width="360" height="88" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.75"/>
  <text x="396" y="268" font-size="16" font-weight="700" fill="#7c3aed">Left thumbstick</text>
  <text x="526" y="268" font-size="16" font-weight="700" fill="#1c1917">Model and revisions</text>
  <g font-size="14" fill="#44403c">
    <text x="396" y="293"><tspan font-weight="600">Push forward:</tspan> aim at the floor with a straight beam</text>
    <text x="396" y="314"><tspan font-weight="600">Release:</tspan> place them there, replacing any old one</text>
  </g>

  <!-- Triggers -->
  <rect x="380" y="346" width="360" height="60" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.75"/>
  <text x="396" y="370" font-size="16" font-weight="700" fill="#dc2626">Triggers</text>
  <text x="396" y="392" font-size="14" fill="#44403c"><tspan font-weight="600">Both:</tspan> press panels  <tspan font-weight="600">Right + can:</tspan> hold to spray</text>

  <!-- Grip -->
  <rect x="380" y="422" width="360" height="84" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.75"/>
  <text x="396" y="448" font-size="16" font-weight="700" fill="#2563eb">Grip</text>
  <text x="440" y="448" font-size="13" fill="#57534e">middle finger, on the mini model</text>
  <g font-size="14" fill="#44403c">
    <text x="396" y="471"><tspan font-weight="600">One hand:</tspan> spin</text>
    <text x="396" y="493"><tspan font-weight="600">Two hands:</tspan> move, zoom and turn</text>
  </g>

  <!-- X button -->
  <rect x="380" y="522" width="360" height="60" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.75"/>
  <text x="396" y="546" font-size="16" font-weight="700" fill="#b45309">X button</text>
  <text x="472" y="546" font-size="16" font-weight="700" fill="#1c1917">Return to start</text>
  <text x="396" y="568" font-size="14" fill="#44403c"><tspan font-weight="600">Hold:</tspan> until the ring fills</text>

  <!-- A button -->
  <rect x="380" y="598" width="360" height="60" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="1.75"/>
  <text x="396" y="622" font-size="16" font-weight="700" fill="#be185d">A button</text>
  <text x="472" y="622" font-size="16" font-weight="700" fill="#1c1917">Remove paint</text>
  <text x="590" y="622" font-size="13" fill="#57534e">while holding the can</text>
  <text x="396" y="644" font-size="14" fill="#44403c"><tspan font-weight="600">Tap:</tspan> undo last stroke  <tspan font-weight="600">Hold:</tspan> delete all paint</text>

  <!-- Y and B buttons -->
  <rect x="380" y="674" width="360" height="60" rx="10" fill="#ffffff" stroke="#4d7c0f" stroke-width="1.75"/>
  <text x="396" y="698" font-size="16" font-weight="700" fill="#4d7c0f">Y or B button</text>
  <text x="510" y="698" font-size="16" font-weight="700" fill="#1c1917">Talk to the agent</text>
  <text x="396" y="720" font-size="14" fill="#44403c"><tspan font-weight="600">Hold:</tspan> while you speak</text>

  <!-- Left controller panel -->
  <rect x="380" y="750" width="360" height="60" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.75"/>
  <text x="396" y="774" font-size="16" font-weight="700" fill="#0369a1">Left controller panel</text>
  <text x="560" y="774" font-size="13" fill="#57534e">press with the right trigger</text>
  <text x="396" y="796" font-size="14" fill="#44403c">Messages · compass to the change · revisions · tool · highlight</text>
</svg>
